<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Открыть Happ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #111;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      margin: 0 0 24px;
      opacity: 0.65;
      line-height: 1.45;
    }

    button,
    a {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    button {
      border: 0;
      background: #fff;
      color: #111;
      cursor: pointer;
    }

    a {
      margin-top: 12px;
      background: rgba(255,255,255,.08);
      color: #fff;
    }

    #status {
      margin-top: 16px;
      min-height: 20px;
      font-size: 13px;
      opacity: 0.55;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>Подключение к Happ</h1>

    <p>
      Открываем приложение
      и добавляем подписку.
    </p>

    <button
      id="openHapp"
      type="button"
    >
      Открыть в Happ
    </button>

    <a
      href="https://happ.info/ru/"
      id="downloadHapp"
    >
      Скачать Happ
    </a>

    <div id="status"></div>

  </main>

  <script>
    const encoded =
      window.location.hash.slice(1)

    const button =
      document.getElementById('openHapp')

    const status =
      document.getElementById('status')

    let subscriptionUrl = ''

    try {
      subscriptionUrl =
        decodeURIComponent(encoded)
    } catch {
      subscriptionUrl = ''
    }

    if (
      !subscriptionUrl
      || !subscriptionUrl.startsWith('https://')
    ) {
      button.disabled = true
      status.textContent =
        'Ссылка подписки недоступна'
    }

    function openHapp() {

      if (!subscriptionUrl) {
        return
      }

      status.textContent =
        'Открываем Happ...'

      window.location.href =
        `happ://add/${subscriptionUrl}`

      /*
       * Если приложение не открылось,
       * через 1.8 сек отправляем
       * пользователя на страницу загрузки.
       */
      window.setTimeout(
        () => {

          if (
            document.visibilityState
            === 'visible'
          ) {
            window.location.href =
              'https://happ.info/ru/'
          }

        },
        1800,
      )
    }

    button.addEventListener(
      'click',
      openHapp,
    )

    /*
     * Пытаемся открыть автоматически.
     */
    if (subscriptionUrl) {
      window.setTimeout(
        openHapp,
        300,
      )
    }
  </script>

</body>
</html>
